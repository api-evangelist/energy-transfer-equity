  corporate domain that answers 200 to everything is a live impersonation surface
  for a Fortune 100 name, and because it is why every /.well-known/ probe on that
  host must be discarded. The successor entity's hosts (energytransfer.com,
  dev.messenger.energytransfer.com) are profiled in all/energy-transfer/ and are
  deliberately NOT scored here.
hosts:
